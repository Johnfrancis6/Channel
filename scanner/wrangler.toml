# Worker unique : sert l'app (fichiers statiques du build Vite) et l'API /api/*.
name = "scanner"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false
# Les variables définies dans le tableau de bord ne sont pas effacées au déploiement.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Seules les routes de l'API réveillent le Worker ; le reste est servi directement.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "scanner"
# Remplacé automatiquement au déploiement par scripts/provision.mjs (voir docs/SETUP.md).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "scanner-files"

[observability]
enabled = true
