name: Scanner

on:
  push:
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner.yml'
  pull_request:
    paths:
      - 'scanner/**'
      - '.github/workflows/scanner.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: scanner

jobs:
  test:
    name: Tests (unitaires + Worker) et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  qualite:
    name: Banc d'essai Playwright (bords + OCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport de qualité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-qualite
          path: scanner/rapport-qualite/
          if-no-files-found: ignore

  deploy:
    name: Déploiement Cloudflare
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: scanner-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
      ACCESS_ALLOWED_EMAILS: ${{ vars.ACCESS_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Création de D1 et R2 si besoin
        run: node scripts/provision.mjs
      - name: Migrations D1
        run: npx wrangler d1 migrations apply DB --remote
      - name: wrangler deploy
        run: |
          args=()
          for v in ACCESS_TEAM_DOMAIN ACCESS_AUD ACCESS_ALLOWED_EMAILS; do
            if [ -n "${!v}" ]; then args+=(--var "$v:${!v}"); fi
          done
          npx wrangler deploy "${args[@]}"
